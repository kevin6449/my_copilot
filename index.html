<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>📝 我的待辦清單</h1>
      <button id="theme-toggle" type="button" class="btn-theme" aria-pressed="false">
        <span id="theme-icon">🌙</span>
        <span id="theme-label">深色模式</span>
      </button>
    </header>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <label class="sr-only" for="todo-input">待辦事項內容</label>
      <input
        id="todo-input"
        class="todo-input"
        type="text"
        placeholder="今天要做什麼?"
        maxlength="100"
        required
      >
      <button type="submit" class="btn-add">新增</button>
    </form>

    <div class="filters" role="group" aria-label="篩選待辦事項">
      <button type="button" class="btn-filter is-active" data-filter="all" aria-pressed="true">全部</button>
      <button type="button" class="btn-filter" data-filter="active" aria-pressed="false">未完成</button>
      <button type="button" class="btn-filter" data-filter="completed" aria-pressed="false">已完成</button>
    </div>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <p id="empty-state" class="empty-state" hidden>還沒有任何待辦事項,新增一個吧!</p>

    <footer class="app-footer">
      <span id="remaining-count">未完成:0 項</span>
      <button
        id="clear-completed"
        type="button"
        class="btn-clear-completed"
        aria-label="清除所有已完成項目"
        hidden
      >
        清除已完成
      </button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
